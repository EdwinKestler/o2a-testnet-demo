[graph]
# Demo dev-dependencies are not built into or distributed with the demo binaries.
exclude-dev = true

[advisories]
yanked = "deny"
# Maintainer decision 2026-09-24: paste is a compile-time-only proc macro
# with no runtime code path. Replacement with pastey remains an upstream need.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "base85@2.0.0", allow = ["MPL-2.0-no-copyleft-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/RGB-WG/rgb"]
required-git-spec = "rev"
