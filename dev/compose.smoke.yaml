# Smoke project only. Pair with dev/compose.yaml.
# bitcoind keeps the image ENTRYPOINT. This command is the image CMD plus the smoke subnet.
services:
  bitcoin:
    command: ["-conf=/etc/bitcoin/bitcoin.conf", "-datadir=/var/lib/bitcoin", "-rpcallowip=172.30.32.0/24"]

networks:
  regtest:
    ipam:
      config: !override
        - subnet: 172.30.32.0/24
