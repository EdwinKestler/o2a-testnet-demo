[workspace]
members = [
    "crates/o2a-demo-core",
    "crates/o2a-demo-rgb",
    "crates/o2a-demo-cli",
    "crates/o2a-demo-seal",
    "crates/o2a-seal-smoke",
]
# Default build is the RGB-free core. The 0.12 crates stay members so the
# archived adapter still resolves, and they are not built by a plain cargo test.
default-members = ["crates/o2a-demo-core"]
# The 0.11.1 adapter is a separate workspace. It must not join this 0.12 graph.
exclude = ["spikes/rgb-0.11.1"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aluvm = "=0.12.0"
amplify = "=4.9.0"
anyhow = "=1.0.104"
bitcoin_hashes = "=0.14.101"
bp-std = { version = "=0.12.0-rc.3", features = ["signers"] }
hex = "=0.4.3"
o2a-demo-core = { version = "=0.1.0", path = "crates/o2a-demo-core" }
o2a-demo-rgb = { version = "=0.1.0", path = "crates/o2a-demo-rgb" }
o2a-demo-seal = { version = "=0.1.0", path = "crates/o2a-demo-seal" }
o2a-seal-smoke = { version = "=0.1.0", path = "crates/o2a-seal-smoke" }
rgb-persist-fs = "=0.12.0-rc.3"
rgb-psbt = { version = "=0.12.0-rc.3", git = "https://github.com/RGB-WG/rgb.git", rev = "a1e6b41524131f6d6f183b2235fdaacb5c1abb31" }
rgb-std = "=0.12.0-rc.3"
rgb-runtime = { version = "=0.12.0-rc.3", git = "https://github.com/RGB-WG/rgb.git", rev = "a1e6b41524131f6d6f183b2235fdaacb5c1abb31", default-features = false, features = ["resolver-electrum", "fs"] }
secp256k1 = "=0.29.1"
sonic-api = "=0.12.0"
strict_encoding = "=2.9.1"
strict_types = "=2.9.1"
ultrasonic = "=0.12.0"

[patch."https://github.com/RGB-WG/rgb.git"]
rgb-psbt = { git = "https://github.com/EdwinKestler/rgb.git", rev = "f1e5a68992700ce208da81682ff092c0d5576e82" }
rgb-runtime = { git = "https://github.com/EdwinKestler/rgb.git", rev = "f1e5a68992700ce208da81682ff092c0d5576e82" }
